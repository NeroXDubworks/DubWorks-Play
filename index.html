<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070d1e" />
  <meta name="description" content="DubWorks Play — conheça os projetos de fandublagem da DubWorks." />
  <title>DubWorks Play — nosso universo de fandubs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="./app.js" defer></script>
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar">
      <a href="#inicio" class="brand" aria-label="DubWorks Play, início">
        <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 42 42"><path d="M8 5c-3.3-2-6 .5-6 3.5v25c0 3.2 3 5.5 6.1 3.7l27.5-13.3c4.5-2.2 4.5-6.1 0-8.4L8 5Z" fill="currentColor"/><path d="m16 14 13 7-13 7V14Z" fill="#07132c"/></svg></span>
        <span class="brand-type"><strong>DubWorks</strong><small>PLAY</small></span>
      </a>
      <nav class="desktop-nav" aria-label="Navegação principal">
        <button class="nav-link active" data-view="inicio">Início</button>
        <button class="nav-link" data-view="catalogo">Catálogo</button>
        <button class="nav-link" data-view="animes">Animes</button>
        <button class="nav-link" data-view="animacoes">Desenhos</button>
        <button class="nav-link" data-view="embreve">Em breve</button>
        <button class="nav-link" data-view="favoritos">Minha lista</button>
      </nav>
      <div class="header-actions">
        <label class="searchbox" aria-label="Buscar projetos"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input type="search" id="search" placeholder="Buscar séries, projetos..." autocomplete="off" /></label>
        <button class="mobile-search" aria-label="Buscar projetos" id="mobile-search-btn"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></button>
        <span class="avatar" title="Visitante">DW</span>
      </div>
    </header>
    <main id="main-content"></main>
    <footer class="footer"><div class="footer-inner"><span class="footer-brand">DubWorks <em>PLAY</em></span><span>Uma vitrine para as produções da nossa comunidade.</span><span class="footer-small">Protótipo de catálogo • Publicação de vídeos sujeita às autorizações dos titulares</span></div></footer>
    <nav class="bottom-nav" aria-label="Navegação mobile">
      <button data-view="inicio" class="active"><span class="nav-glyph">⌂</span><small>Início</small></button>
      <button data-view="catalogo"><span class="nav-glyph">▦</span><small>Catálogo</small></button>
      <button data-view="embreve"><span class="nav-glyph">◷</span><small>Em breve</small></button>
      <button data-view="favoritos"><span class="nav-glyph">♡</span><small>Minha lista</small></button>
    </nav>
    <div class="modal-layer" id="modal-layer" hidden><div class="modal-backdrop" data-close="true"></div><div id="modal-content" class="project-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</body>
</html>
